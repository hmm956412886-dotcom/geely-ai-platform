services:
  postgres:
    image: postgres:16
    container_name: geely-ai-postgres
    environment:
      POSTGRES_DB: geely_ai
      POSTGRES_USER: geely_ai
      POSTGRES_PASSWORD: geely_ai_local_only
    ports:
      - "5432:5432"
    volumes:
      - geely_ai_postgres:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: geely-ai-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - geely_ai_qdrant:/qdrant/storage

  redis:
    image: redis:7
    container_name: geely-ai-redis
    ports:
      - "6379:6379"
    volumes:
      - geely_ai_redis:/data

  minio:
    image: minio/minio:latest
    container_name: geely-ai-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: geely_ai
      MINIO_ROOT_PASSWORD: geely_ai_local_only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - geely_ai_minio:/data

volumes:
  geely_ai_postgres:
  geely_ai_qdrant:
  geely_ai_redis:
  geely_ai_minio:

