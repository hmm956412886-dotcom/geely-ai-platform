[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geely-ai-gateway"
version = "0.1.0"
description = "Embeddable AI Gateway MVP for customer software integration"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
analytics = ["duckdb>=1.0.0"]
agent = ["semantic-kernel==1.44.0"]

[project.scripts]
geely-ai-gateway = "ai_gateway.server:main"
